StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Base

Packages = Google, Microsoft

# 🛡️ Configure rule exceptions for the root README file
[README.md]
BasedOnStyles = Vale
Google.EmDash = NO
Microsoft.Dashes = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.Spelling = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO
Google.Headings = NO
Google.OxfordComma = NO
Microsoft.Terms = NO
Microsoft.Adverbs = NO

# Every hand-written page is linted. The generated API reference
# (docs/api/reference, .mdx) is excluded: it's produced from
# openapi/payflow.yaml, so wording is fixed in the spec, not the output.
[docs/**/*.{md,mdx}]
BasedOnStyles = Vale, Google, Microsoft, Portfolio

# Ignore front matter metadata blocks (id, slug, etc.) so fields like
# "template-sop" aren't linted as prose
BlockIgnores = (?s)^(---\s*\n.*?\n---)

# Deliberately disabled or downgraded, not oversights:
# - Dash rules: this site uses a spaced en dash by design. Portfolio.Dashes
#   enforces that convention instead.
# - FirstPerson: the bio and case-study pages are first-person narrative,
#   not product docs.
# - Spelling (Americanisms) and Quotes: the site is British English –
#   British spelling, and punctuation outside quotation marks.
# - Word list / word list case: Google product-branding rules, not
#   applicable here.
# - Colons: false-positives on bold "Label:" metadata lines, misread as
#   headings.
# - Headings (Google): the page title (H1) is Title Case; every heading
#   below that (H2+) is sentence case. Vale's Google.Headings rule doesn't
#   distinguish heading levels, so turning it on would incorrectly flag the
#   intentional H1 Title Case – this convention is enforced by review, not CI.
# - Contractions: the product docs and API reference keep the uncontracted
#   form. Downgraded to a warning so it stays visible without failing CI.
# - Heading acronyms: this is a site about API documentation. Headings like
#   "API Keys" and "KX – Senior Technical Writer" are correct, not oversights.
# - Heading punctuation: FAQ-style headings ("Still need help?", "Why
#   Logpilot?") end in a question mark by design.
# - GeneralURL: the audience is developers; "URL" is the precise term, not
#   a jargon substitute for "address".
# - We/first-person plural: product and support copy (PayFlow, Logpilot)
#   speaks in the company's voice ("our compliance team", "we'll verify").
#   That's standard for the fictional docs these pages model, not a slip
#   into the wrong register.
# - Terms: this rule's jargon substitutions don't fit a technical audience
#   ("specification" for "spec", "personal digital assistant" for "agent"
#   in AI-tooling content). Same call as the README exception below.
Google.EmDash = NO
Microsoft.Dashes = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.Spelling = NO
Google.Quotes = NO
Microsoft.Quotes = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO
Google.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingPunctuation = NO
Microsoft.GeneralURL = NO
Google.We = NO
Microsoft.We = NO
Microsoft.Terms = NO
Microsoft.Contractions = warning

# Generated from openapi/payflow.yaml by docusaurus-plugin-openapi-docs on
# every build; wording lives in the spec, not here, so don't lint the output
[docs/api/reference/**/*.mdx]
BasedOnStyles =

# Glossary entries are a bold term followed by a definition that
# legitimately opens with the same word ("Controlled documentation" /
# "Documentation that…"), which the repetition check misreads.
[docs/glossary/intro.md]
Vale.Repetition = NO

# Third-party testimonials are quoted verbatim, not edited to the style guide.
[docs/about/testimonials.md]
BasedOnStyles =

# BlockIgnores doesn't reach front matter's raw-scope term checks, so the
# kebab-case id/slug "template-sop" reads as the lowercase word "sop"
[docs/process-governance/template-sop.md]
Vale.Terms = NO
