<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9AA5B1"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="691" height="384" rx="24" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <text x="30" y="32" font-size="15" font-weight="700" fill="#16311F">Review-reminder process: before and after</text>

  <line x1="350" y1="70" x2="350" y2="376" stroke="#D1D5DB" stroke-width="1.5" stroke-dasharray="4 4"/>

  <text x="30" y="58" font-size="14" font-weight="700" fill="#92400E">Current state</text>
  <text x="370" y="58" font-size="14" font-weight="700" fill="#2154C9">Future state</text>

  <!-- Current state column -->
  <g>
    <rect x="30" y="78" width="300" height="55" rx="10" fill="#FDF2E9" stroke="#F3C99B" stroke-width="1.5"/>
    <text x="180" y="110" font-size="13" fill="#92400E" text-anchor="middle">Review date set on page</text>
  </g>
  <line x1="180" y1="135" x2="180" y2="153" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="155" width="300" height="55" rx="10" fill="#FDF2E9" stroke="#F3C99B" stroke-width="1.5"/>
    <text x="180" y="187" font-size="13" fill="#92400E" text-anchor="middle">Nothing checks it</text>
  </g>
  <line x1="180" y1="212" x2="180" y2="230" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="232" width="300" height="55" rx="10" fill="#FDF2E9" stroke="#F3C99B" stroke-width="1.5"/>
    <text x="180" y="264" font-size="13" fill="#92400E" text-anchor="middle">Page quietly goes overdue</text>
  </g>
  <line x1="180" y1="289" x2="180" y2="307" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="30" y="309" width="300" height="55" rx="10" fill="#FDF2E9" stroke="#F3C99B" stroke-width="1.5"/>
    <text x="180" y="330" font-size="13" fill="#92400E" text-anchor="middle">Found by chance, or the</text>
    <text x="180" y="347" font-size="13" fill="#92400E" text-anchor="middle">next audit – eventually</text>
  </g>

  <!-- Future state column -->
  <g>
    <rect x="370" y="78" width="300" height="55" rx="10" fill="#EAF1FC" stroke="#BBD3F5" stroke-width="1.5"/>
    <text x="520" y="110" font-size="13" fill="#2154C9" text-anchor="middle">Review date set on page</text>
  </g>
  <line x1="520" y1="135" x2="520" y2="153" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="370" y="155" width="300" height="55" rx="10" fill="#EAF1FC" stroke="#BBD3F5" stroke-width="1.5"/>
    <text x="520" y="187" font-size="13" fill="#2154C9" text-anchor="middle">Weekly automated check</text>
  </g>
  <line x1="520" y1="212" x2="520" y2="230" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="370" y="232" width="300" height="55" rx="10" fill="#EAF1FC" stroke="#BBD3F5" stroke-width="1.5"/>
    <text x="520" y="253" font-size="13" fill="#2154C9" text-anchor="middle">Owner nudged 2 weeks</text>
    <text x="520" y="270" font-size="13" fill="#2154C9" text-anchor="middle">before it's due</text>
  </g>
  <line x1="520" y1="289" x2="520" y2="307" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="370" y="309" width="300" height="55" rx="10" fill="#EAF1FC" stroke="#BBD3F5" stroke-width="1.5"/>
    <text x="520" y="341" font-size="13" fill="#2154C9" text-anchor="middle">Second nudge if it goes overdue</text>
  </g>
</svg>
