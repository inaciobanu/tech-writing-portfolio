StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Base

Packages = Google, Microsoft

[docs/process-governance/**/*.md]
BasedOnStyles = Vale, Google, Microsoft

# Deliberately disabled, not oversights:
# - Dash spacing: this site uses a spaced en dash by design, not a bare em dash.
# - FirstPerson: the case study pages are first-person narrative, not product docs.
# - Spelling (Americanisms): the author bio is British English (London-based).
# - Word list / word list case: Google product-branding rules, not applicable here.
# - Colons: false-positives on bold "Label:" metadata lines, misread as headings.
Google.EmDash = NO
Microsoft.Dashes = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.Spelling = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO
