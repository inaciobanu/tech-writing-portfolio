StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = Base

Packages = Google, Microsoft

# 🛡️ Configure rule exceptions for the root README file
[README.md]
BasedOnStyles = Vale
Google.EmDash = NO
Microsoft.Dashes = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.Spelling = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO
Google.Headings = NO
Google.OxfordComma = NO
Microsoft.Terms = NO
Microsoft.Adverbs = NO

[docs/process-governance/**/*.md]
BasedOnStyles = Vale, Google, Microsoft

# Ignore front matter metadata blocks for these docs
BlockIgnores = (?s)^(---\s*\n.*?\n---)

# Deliberately disabled style sheets for case studies:
Google.EmDash = NO
Microsoft.Dashes = NO
Google.FirstPerson = NO
Microsoft.FirstPerson = NO
Google.Spelling = NO
Google.WordList = NO
Google.WordListCase = NO
Google.Colons = NO

[*.md]
BasedOnStyles = Vale, Google, Microsoft

# Protect all standard markdown front matter blocks across the repo
BlockIgnores = (?s)^(---\s*\n.*?\n---)