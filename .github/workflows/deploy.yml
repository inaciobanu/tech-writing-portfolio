name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          npm install
          rm -rf docs/api/reference          # 🧹 Force-wipes the old cached reference folder!
          npm run gen-api-docs               # 🔌 Generates pristine markdown files from the synced spec
          npm run build

      # PR previews are stored on the gh-pages branch under previews/pr-<n>/
      # by the pr-preview workflow. GitHub Pages only serves what this
      # workflow uploads, so copy them into the build before publishing.
      - name: Include PR previews
        run: |
          if git fetch --depth=1 origin gh-pages; then
            git archive origin/gh-pages previews 2>/dev/null | tar -x -C build \
              && echo "Included previews: $(ls build/previews)" \
              || echo "No previews stored on gh-pages."
          else
            echo "No gh-pages branch, skipping previews."
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Upload build for link check
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build

  linkcheck:
    name: Check external links
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-build
          path: build

      # The site is served under the /tech-writing-portfolio/ base path, so
      # every root-relative link in the HTML starts with it – but the build
      # output itself is flat. Nest it the same way so lychee resolves
      # root-relative links the way a browser actually would.
      - name: Mirror the served path
        run: |
          mkdir -p site/tech-writing-portfolio
          cp -r build/. site/tech-writing-portfolio/

      - name: Lychee link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --exclude-loopback
            --exclude 'medium\.com'
            --exclude 'x\.com'
            --exclude 'payflow\.io'
            --exclude 'github\.com/logpilot/logpilot'
            --exclude 'npmjs\.com/package/logpilot'
            --root-dir ${{ github.workspace }}/site
            --fallback-extensions html
            './site/tech-writing-portfolio/**/*.html'
          fail: true

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
